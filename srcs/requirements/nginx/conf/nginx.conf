server {
    # Listen only on port 443 with SSL enabled
    listen 443 ssl;
    listen [::]:443 ssl;

    # The domain name will be dynamically injected by our initialization script
    server_name DOMAIN_NAME_PLACEHOLDER;

    # Point NGINX to the self-signed certificates we will generate
    ssl_certificate /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;
    
    # Strictly enforce TLSv1.2 and TLSv1.3 as required by the subject
    ssl_protocols TLSv1.2 TLSv1.3;

    # Where the WordPress files will be mounted
    root /var/www/html;
    index index.php index.html index.htm;

    # Try to serve the file directly, if not found, pass to index.php (Standard WordPress routing)
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # If the requested file is a PHP file, proxy it to the WordPress container
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Send the request to the 'wordpress' container over port 9000
        fastcgi_pass wordpress:9000;
    }
}
