<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inception | Static Showcase</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; padding: 0; font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); 
            color: white; display: flex; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden; 
        }
        .card { 
            background: rgba(255, 255, 255, 0.05); padding: 3rem; 
            border-radius: 20px; backdrop-filter: blur(10px); 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            text-align: center; max-width: 500px; 
            transform: translateY(0); transition: transform 0.4s ease; 
        }
        .card:hover { transform: translateY(-10px); }
        h1 { 
            margin: 0 0 10px; font-size: 2.8rem; 
            background: linear-gradient(90deg, #3b82f6, #8b5cf6); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
        }
        p { color: #94a3b8; font-size: 1.1rem; line-height: 1.6; margin-bottom: 30px; }
        .tag {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa; padding: 5px 12px; border-radius: 50px;
            font-size: 0.8rem; font-weight: bold; margin-bottom: 20px; display: inline-block;
        }
        .btn { 
            display: inline-block; padding: 12px 28px; 
            background: #3b82f6; color: white; text-decoration: none; 
            border-radius: 8px; font-weight: bold; transition: all 0.3s ease; 
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        .btn:hover { background: #2563eb; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="card">
        <div class="tag">BONUS PROJECT</div>
        <h1>Inception</h1>
        <p>Welcome to the custom static site! This sleek showcase is served entirely by a lightweight Node.js Express server running in its own dedicated Docker container.</p>
        <a href="https://acaldeir.42.fr" class="btn">Back to WordPress</a>
    </div>
</body>
</html>
