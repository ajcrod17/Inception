# Run vsftpd in standalone mode listening natively for incoming connections
listen=YES

# Force vsftpd to run in the foreground (Crucial for Docker so the container doesn't exit)
background=NO

# Do not listen on IPv6 sockets
listen_ipv6=NO

# Disable anonymous logins (users must authenticate)
anonymous_enable=NO

# Allow local system users (like our ftp_user) to log in
local_enable=YES

# Enable FTP commands that change the filesystem (like upload, delete, rename)
write_enable=YES

# Default permissions for newly uploaded files (022 means files get 644, dirs get 755)
local_umask=022

# Display directory messages (like .message files) when users enter a directory
dirmessage_enable=YES

# Use the local system time for directory listings instead of UTC
use_localtime=YES

# Enable logging of all file uploads and downloads
xferlog_enable=YES

# Ensure PORT transfer connections originate from port 20 (ftp-data)
connect_from_port_20=YES

# Jail (chroot) local users to their home directory (/var/www/html)so they can't browse the rest of the server
chroot_local_user=YES

# Specify an empty, unprivileged directory required for vsftpd's secure chroot operation
secure_chroot_dir=/var/run/vsftpd/empty

# The name of the PAM configuration file used for authentication
pam_service_name=vsftpd

# Allow the user to write to their chroot jail directory (required if chroot_local_user is YES and the home directory is writable)
allow_writeable_chroot=YES

# Enable Passive (PASV) mode for data transfers (required for clients behind NAT/firewalls)
pasv_enable=YES

# The minimum port to allocate for passive data transfers
pasv_min_port=21100

# The maximum port to allocate for passive data transfers
pasv_max_port=21110
