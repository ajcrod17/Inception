
services:
  mariadb:
    build: requirements/mariadb
    container_name: mariadb
    image: mariadb
    restart: always
    env_file: .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_vol:/var/lib/mysql
    networks:
      - inception_net

  wordpress:
    build: requirements/wordpress
    container_name: wordpress
    image: wordpress
    restart: always
    depends_on:
      - mariadb
      - redis
    env_file: .env
    secrets:
      - db_password
      - credentials
    volumes:
      - wordpress_vol:/var/www/html
    networks:
      - inception_net

  nginx:
    build: requirements/nginx
    container_name: nginx
    image: nginx
    restart: always
    depends_on:
      - wordpress
    env_file: .env
    ports:
      - "443:443"
    volumes:
      - wordpress_vol:/var/www/html
      - nginx_logs:/var/log/nginx
    networks:
      - inception_net

  adminer:
    build: requirements/adminer
    container_name: adminer
    image: adminer
    restart: always
    depends_on:
      - mariadb
    ports:
      - "8080:8080"
    networks:
      - inception_net

  static_site:
    build: requirements/static_site
    container_name: static_site
    image: static_site
    restart: always
    ports:
      - "3000:3000"
    networks:
      - inception_net

  redis:
    build: requirements/redis
    container_name: redis
    image: redis
    restart: always
    networks:
      - inception_net

  goaccess:
    build: requirements/goaccess
    container_name: goaccess
    image: goaccess
    restart: always
    depends_on:
      - nginx
    ports:
      - "7890:7890"
    volumes:
      - wordpress_vol:/var/www/html
      - nginx_logs:/var/log/nginx:ro
    networks:
      - inception_net

networks:
  inception_net:
    driver: bridge

volumes:
  mariadb_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/mariadb
  wordpress_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/wordpress

  nginx_logs:

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt
